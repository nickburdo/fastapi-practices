[project]
name = "fastapi-as"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.6",
]

[tool.ruff]
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = ["I"]
unfixable = ["F401"]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
